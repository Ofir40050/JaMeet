<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaMeet Presenter Controls</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      height: 100vh;
      width: 100vw;
    }

    /* The pill is draggable, but individual controls override with no-drag */
    .presenter-bar {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 8px;
      background: rgba(17, 22, 32, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 26px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.4);
      -webkit-app-region: drag;
      height: 44px;
      position: relative;
      flex-shrink: 0;
    }

    .drag-handle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px 0 2px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: grab;
      flex-shrink: 0;
    }

    .drag-icon {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .drag-icon span {
      display: block;
      width: 12px;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 1px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse-green 2s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .v-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .control-btn {
      -webkit-app-region: no-drag;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 9px;
      border-radius: 16px;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .control-btn:active {
      transform: scale(0.97);
    }

    .control-btn.active {
      background: rgba(59, 130, 246, 0.18);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.4);
    }

    .control-btn.muted {
      color: #f87171;
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .control-btn.paused {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .control-btn.btn-stop {
      background: #dc2626;
      color: #ffffff;
      border: 1px solid #ef4444;
      padding: 0 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .control-btn.btn-stop:hover {
      background: #b91c1c;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.5);
    }

    .btn-icon-svg {
      width: 15px;
      height: 15px;
      min-width: 15px;
      min-height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Dropdown More Menu */
    .more-menu {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 48px;
      right: 90px;
      background: #111620;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 200px;
      z-index: 1000;
    }

    .more-menu.hidden {
      display: none;
    }

    .more-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      transition: background 0.12s ease;
    }

    .more-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .more-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 3px 0;
    }
  </style>
</head>
<body>
  <div class="presenter-bar" id="presenter-bar">
    <div class="drag-handle" title="Drag to move controls">
      <div class="drag-icon">
        <span></span>
        <span></span>
      </div>
      <div class="brand-dot" title="Sharing live"></div>
    </div>

    <!-- Mic Button -->
    <button id="btn-mic" class="control-btn" title="Toggle Microphone">
      <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      <span id="mic-text">Mute</span>
    </button>

    <!-- Camera Button -->
    <button id="btn-cam" class="control-btn" title="Toggle Camera">
      <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
      <span id="cam-text">Camera</span>
    </button>

    <div class="v-divider"></div>

    <!-- Pause Share Button -->
    <button id="btn-pause" class="control-btn" title="Pause Screen Sharing">
      <svg class="btn-icon-svg" viewBox="0 0 24 24"><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></svg>
      <span id="pause-text">Pause Share</span>
    </button>

    <!-- Show JaMeet Window -->
    <button id="btn-show-app" class="control-btn" title="Show main JaMeet window">
      <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      <span>JaMeet</span>
    </button>

    <!-- More Options Dropdown -->
    <button id="btn-more" class="control-btn" title="More Options">
      <svg class="btn-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>More</span>
    </button>

    <div class="v-divider"></div>

    <!-- Stop Share Button -->
    <button id="btn-stop" class="control-btn btn-stop" title="Stop Screen Share">
      <svg class="btn-icon-svg" viewBox="0 0 24 24"><rect width="14" height="14" x="5" y="5" rx="2" fill="currentColor"/></svg>
      <span>Stop Share</span>
    </button>

    <!-- More Menu Dropdown -->
    <div id="more-menu" class="more-menu hidden">
      <button id="item-mode" class="more-item">
        <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span id="mode-text">Music Mode</span>
      </button>
      <button id="item-workspace" class="more-item">
        <svg class="btn-icon-svg" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        <span>Project Workspace</span>
      </button>
      <button id="item-layout" class="more-item">
        <svg class="btn-icon-svg" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/></svg>
        <span>Participant Layout</span>
      </button>
      <div class="more-divider"></div>
      <button id="item-change-source" class="more-item">
        <svg class="btn-icon-svg" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        <span>Change Shared Source…</span>
      </button>
      <button id="item-remote-mixer" class="more-item">
        <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span>Remote Monitor Mixer…</span>
      </button>
      <button id="item-audio-settings" class="more-item">
        <svg class="btn-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Audio Settings…</span>
      </button>
      <div class="more-divider"></div>
      <button id="item-toggle-video" class="more-item">
        <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M15 10l5-5v14l-5-5z"/><rect width="13" height="14" x="1" y="5" rx="2"/></svg>
        <span id="pip-text">Hide Floating Video</span>
      </button>
    </div>
  </div>

  <script>
    let currentState = {
      micMuted: false,
      camEnabled: true,
      mode: 'music',
      paused: false,
      pipVisible: true
    };

    function sendAction(action, data) {
      const api = window.jameet || window.musiczoom;
      if (api?.sendPresenterAction) {
        api.sendPresenterAction(action, data);
      }
    }

    // ── Mouse-event pass-through ──────────────────────────────────────────
    const bar = document.getElementById('presenter-bar');
    const moreMenu = document.getElementById('more-menu');

    function isOverInteractiveArea(x, y) {
      if (bar) {
        const rect = bar.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return true;
        }
      }
      if (moreMenu && !moreMenu.classList.contains('hidden')) {
        const rect = moreMenu.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return true;
        }
      }
      return false;
    }

    function setMouseIgnore(ignore) {
      const api = window.jameet || window.musiczoom;
      if (api?.setPresenterMouseIgnore) {
        api.setPresenterMouseIgnore(ignore);
      }
    }

    window.addEventListener('mousemove', (e) => {
      const over = isOverInteractiveArea(e.clientX, e.clientY);
      setMouseIgnore(!over);
    });

    bar?.addEventListener('mouseenter', () => setMouseIgnore(false));
    bar?.addEventListener('mouseleave', (e) => {
      if (!isOverInteractiveArea(e.clientX, e.clientY)) {
        setMouseIgnore(true);
      }
    });

    function updateUi(state) {
      if (!state) return;
      Object.assign(currentState, state);

      // Mic
      const btnMic = document.getElementById('btn-mic');
      const micText = document.getElementById('mic-text');
      if (btnMic && micText) {
        btnMic.classList.toggle('muted', currentState.micMuted);
        micText.textContent = currentState.micMuted ? 'Unmute' : 'Mute';
      }

      // Camera
      const btnCam = document.getElementById('btn-cam');
      const camText = document.getElementById('cam-text');
      if (btnCam) {
        btnCam.classList.toggle('active', currentState.camEnabled);
        btnCam.classList.toggle('muted', !currentState.camEnabled);
        if (camText) camText.textContent = currentState.camEnabled ? 'Camera' : 'Camera Off';
      }

      // Mode
      const modeText = document.getElementById('mode-text');
      if (modeText) {
        const isMusic = currentState.mode === 'music';
        modeText.textContent = isMusic ? 'Music Mode (Active)' : 'Talk Mode (Active)';
      }

      // Pause
      const btnPause = document.getElementById('btn-pause');
      const pauseText = document.getElementById('pause-text');
      if (btnPause && pauseText) {
        btnPause.classList.toggle('paused', currentState.paused);
        pauseText.textContent = currentState.paused ? 'Resume Share' : 'Pause Share';
      }

      // PiP
      const pipText = document.getElementById('pip-text');
      if (pipText) {
        pipText.textContent = currentState.pipVisible ? 'Hide Floating Video' : 'Show Floating Video';
      }
    }

    // Attach button listeners
    document.getElementById('btn-mic')?.addEventListener('click', () => sendAction('toggle-mic'));
    document.getElementById('btn-cam')?.addEventListener('click', () => sendAction('toggle-cam'));
    document.getElementById('btn-pause')?.addEventListener('click', () => sendAction('toggle-pause'));
    document.getElementById('btn-show-app')?.addEventListener('click', () => sendAction('show-main-window'));
    document.getElementById('btn-stop')?.addEventListener('click', () => sendAction('stop-share'));

    // More menu toggle
    const btnMore = document.getElementById('btn-more');
    btnMore?.addEventListener('click', (e) => {
      e.stopPropagation();
      moreMenu?.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!moreMenu?.contains(e.target) && e.target !== btnMore) {
        moreMenu?.classList.add('hidden');
      }
    });

    document.getElementById('item-mode')?.addEventListener('click', () => {
      moreMenu?.classList.add('hidden');
      sendAction('toggle-mode');
    });

    document.getElementById('item-workspace')?.addEventListener('click', () => {
      moreMenu?.classList.add('hidden');
      sendAction('toggle-workspace');
    });

    document.getElementById('item-layout')?.addEventListener('click', () => {
      moreMenu?.classList.add('hidden');
      sendAction('toggle-layout');
    });

    document.getElementById('item-change-source')?.addEventListener('click', () => {
      moreMenu?.classList.add('hidden');
      sendAction('change-source');
    });

    document.getElementById('item-remote-mixer')?.addEventListener('click', () => {
      moreMenu?.classList.add('hidden');
      sendAction('open-remote-mixer');
    });

    document.getElementById('item-audio-settings')?.addEventListener('click', () => {
      moreMenu?.classList.add('hidden');
      sendAction('open-audio-settings');
    });

    document.getElementById('item-toggle-video')?.addEventListener('click', () => {
      moreMenu?.classList.add('hidden');
      sendAction('toggle-floating-video');
    });

    // Listen for state updates from main process
    const api = window.jameet || window.musiczoom;
    if (api?.onPresenterStateUpdate) {
      api.onPresenterStateUpdate((state) => {
        updateUi(state);
      });
    }
  </script>
</body>
</html>
