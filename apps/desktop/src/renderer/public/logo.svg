<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1648d0" />
      <stop offset="45%" stop-color="#08309a" />
      <stop offset="100%" stop-color="#020f3e" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="j-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f5ff" />
      <stop offset="100%" stop-color="#d4e4ff" />
    </linearGradient>
    <linearGradient id="j-bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a75ff" />
      <stop offset="100%" stop-color="#0051e6" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="38" y="38" width="436" height="436" rx="104" ry="104" fill="url(#bg-grad)" />

  <!-- Equalizer Audio Waveform -->
  <g fill="url(#wave-grad)">
    <rect x="101" y="225" width="20" height="62" rx="10" />
    <rect x="132" y="196" width="20" height="120" rx="10" />
    <rect x="163" y="168" width="20" height="176" rx="10" />
    <rect x="194" y="206" width="20" height="100" rx="10" />
    <rect x="225" y="225" width="20" height="62" rx="10" />
  </g>

  <!-- J-Logo Body with 3D Gloss / Multi-Tone Shading -->
  <!-- Upper & Central White J Stem -->
  <path d="M246 178 C256 142 278 123 325 123 L350 123 C350 123 350 200 350 295 C350 340 326 388 274 388 C215 388 174 345 150 295 C170 295 200 295 210 295 C225 328 245 344 274 344 C300 344 308 318 308 290 L308 178 Z" fill="url(#j-top-grad)" filter="url(#subtle-shadow)" />
  
  <!-- J Lower Dynamic Blue Wave Accent -->
  <path d="M150 295 C174 345 215 388 274 388 C326 388 350 340 350 295 C350 270 346 250 338 238 C310 295 260 365 150 295 Z" fill="url(#j-bottom-grad)" />

  <!-- Video Camera Triangle Emitter -->
  <polygon points="350,165 416,136 416,244 350,215" fill="url(#j-top-grad)" opacity="0.95" filter="url(#subtle-shadow)" />
</svg>
