
      <!-- MODAL: NEW SONG / TRACK IN PROJECT -->
      <div id="new-song-modal" class="modal hidden">
        <div class="modal-card modal-card-sm">
          <div class="modal-header">
            <h3 class="modal-title-clean">New Song / Track</h3>
            <button id="btn-close-new-song-modal" type="button" class="modal-close-btn" aria-label="Close">✕</button>
          </div>
          <div class="modal-body">
            <label for="input-new-song-title" class="custom-label">Song Title</label>
            <input
              id="input-new-song-title"
              type="text"
              class="custom-input"
              placeholder="e.g. Midnight Drive, Track 2, Acoustic Ballad…"
              maxlength="80"
              autocomplete="off"
            />
            <div class="doc-preset-chips" id="song-title-presets">
              <button type="button" class="btn-song-title-preset" data-title="Track 2">Track 2</button>
              <button type="button" class="btn-song-title-preset" data-title="Track 3">Track 3</button>
              <button type="button" class="btn-song-title-preset" data-title="Acoustic Version">Acoustic</button>
              <button type="button" class="btn-song-title-preset" data-title="Instrumental">Instrumental</button>
            </div>
            <p id="new-song-error" class="modal-error hidden"></p>
          </div>
          <div class="modal-footer">
            <button id="btn-cancel-new-song" type="button" class="btn-secondary">Cancel</button>
            <button id="btn-confirm-create-song" type="button" class="btn-primary">Create Song</button>
          </div>
        </div>
      </div>

      <!-- LYRICS DOCUMENT OPTIONS POPOVER -->
      <div id="lyrics-doc-options-popover" class="project-menu-dropdown hidden">
        <button id="btn-doc-opt-duplicate" type="button" class="project-menu-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          <span>Duplicate Document</span>
        </button>
        <button id="btn-doc-opt-copy-text" type="button" class="project-menu-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Copy Full Lyrics</span>
        </button>
        <div class="project-menu-divider"></div>
        <button id="btn-doc-opt-delete" type="button" class="project-menu-item project-menu-danger">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
          <span>Delete Document</span>
        </button>
      </div>
