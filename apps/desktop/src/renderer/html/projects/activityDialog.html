
      <!-- MODAL: PROJECT ACTIVITY HISTORY DIALOG -->
      <div id="project-activity-dialog" class="dialog-overlay hidden">
        <div class="dialog-card activity-dialog-card">
          <div class="dialog-header activity-dialog-header">
            <div class="dialog-title-wrap">
              <span class="activity-header-icon-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
              </span>
              <div>
                <h3 class="dialog-title">Project Activity History</h3>
                <p class="dialog-subtitle" id="activity-dialog-subtitle">Creative changes and milestones for this song</p>
              </div>
            </div>
            <button id="btn-close-activity-dialog" type="button" class="modal-close-btn" aria-label="Close">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>

          <div class="activity-dialog-toolbar">
            <div class="activity-search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="activity-search-input" type="text" class="activity-search-input" placeholder="Search activity history…" />
            </div>
            <span id="activity-dialog-count-badge" class="badge-count">0 Events</span>
          </div>

          <div class="activity-dialog-body" id="activity-dialog-list">
            <!-- Populated dynamically -->
          </div>

          <div id="activity-dialog-pagination" class="activity-dialog-pagination">
            <span id="activity-pagination-info" class="activity-pagination-info">Showing 1–10 of 10</span>
            <div class="activity-pagination-actions">
              <button id="btn-activity-prev-page" type="button" class="btn-pagination" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="m15 18-6-6 6-6"/></svg>
                <span>Prev</span>
              </button>
              <span id="activity-page-number" class="activity-page-indicator">1 / 1</span>
              <button id="btn-activity-next-page" type="button" class="btn-pagination" disabled>
                <span>Next</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
