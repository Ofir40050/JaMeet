
      <!-- ALL SESSIONS VIEW (Dedicated Session History View) -->
      <section id="all-sessions-view" class="view hidden">
        <div class="sessions-view-content">
          <!-- Integrated Centered Top Navigation Bar -->
          <div class="sessions-topbar">
            <button id="btn-sessions-back" type="button" class="btn-project-back-pill" title="Back to Home">
              <span class="btn-back-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
              </span>
              <span>Back to Home</span>
            </button>
            <div class="sessions-breadcrumbs">
              <span class="crumb-brand">JAMEET</span>
              <span class="crumb-sep">/</span>
              <span class="crumb-current">Session History</span>
            </div>
            <div class="sessions-topbar-actions">
              <button id="btn-refresh-all-sessions" type="button" class="btn-refresh-sessions" title="Refresh session history">
                <span class="refresh-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </span>
                <span>Refresh</span>
              </button>
            </div>
          </div>

          <!-- Sessions Hero Card -->
          <div class="sessions-hero-card">
            <div class="sessions-hero-main">
              <div class="sessions-hero-identity">
                <div class="sessions-hero-title-row">
                  <span class="sessions-hero-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  </span>
                  <h2 class="sessions-hero-title">Session History</h2>
                  <span id="all-sessions-total-badge" class="badge-count">0 sessions</span>
                </div>
                <p class="sessions-hero-description">All completed studio sessions, recordings, and collaborator jam logs saved to your JaMeet account.</p>
              </div>
              <div class="sessions-hero-actions">
                <button id="btn-start-session-from-history" type="button" class="primary sessions-start-btn">
                  <span class="btn-icon-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                  </span>
                  <span>Start New Session</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Sessions List Card -->
          <div class="sessions-panel-card">
            <div class="section-header-row">
              <div class="section-title-wrap">
                <span class="section-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
                </span>
                <h3>All Recorded Sessions</h3>
                <span id="all-sessions-panel-count" class="badge-count">0</span>
              </div>
            </div>

            <div id="all-sessions-empty" class="recent-sessions-empty hidden">
              <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
              </div>
              <h4>No previous sessions yet</h4>
              <p>Host or join a studio session above to start recording your music collaboration history.</p>
            </div>

            <div id="all-sessions-list" class="recent-sessions-list"></div>
          </div>
        </div>
      </section>
