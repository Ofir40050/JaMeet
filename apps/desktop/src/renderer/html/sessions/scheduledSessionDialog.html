
      <!-- SCHEDULED SESSION DIALOG (CREATE / EDIT) -->
      <dialog id="scheduled-session-dialog" class="studio-dialog scheduled-dialog">
        <form id="scheduled-session-form" class="dialog-content auth-dialog-content">
          <div class="dialog-head">
            <div class="dialog-title-wrap">
              <span class="dialog-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
              </span>
              <div>
                <h2 id="scheduled-dialog-title">Schedule a Session</h2>
                <p class="dialog-subtitle-top">Set a title, date, and time for an upcoming studio session.</p>
              </div>
            </div>
            <button id="btn-close-scheduled-dialog" type="button" class="dialog-close" aria-label="Close">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>

          <div class="dialog-body">
            <input type="hidden" id="scheduled-session-edit-id" value="" />

            <div class="auth-form-group">
              <label for="scheduled-session-title-input">
                <span>Session Title</span>
              </label>
              <input id="scheduled-session-title-input" class="custom-input auth-input" placeholder="e.g. Vocal Tracking & Mix Review" required maxlength="120" />
            </div>

            <div class="auth-form-group mt-3">
              <label for="scheduled-session-datetime-input">
                <span>Date & Time (Local Time)</span>
              </label>
              <input id="scheduled-session-datetime-input" type="datetime-local" class="custom-input auth-input" required />
            </div>

            <p id="scheduled-dialog-status" class="message error mt-3 hidden" role="alert"></p>

            <div class="guest-actions mt-4">
              <button id="btn-cancel-scheduled-dialog" type="button" class="btn-dialog-secondary">Cancel</button>
              <button id="btn-submit-scheduled-dialog" type="submit" class="btn-guest-join">Save Schedule</button>
            </div>
          </div>
        </form>
      </dialog>
