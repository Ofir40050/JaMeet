
      <!-- 2.5 WAITING ROOM VIEW (FOR PENDING PARTICIPANTS) -->
      <section id="waiting-view" class="view centered hidden">
        <div class="card waiting-card">
          <div class="waiting-header">
            <div class="waiting-badge">
              <span class="waiting-dot"></span>
              <span>WAITING ROOM</span>
            </div>
            <h2 class="waiting-title">Waiting for host to admit you</h2>
            <p class="waiting-desc">The host has been notified and will let you into the live session shortly.</p>
          </div>

          <div class="waiting-details-card">
            <div class="waiting-meta-row">
              <span class="meta-label">Host:</span>
              <span id="waiting-host-name" class="meta-value">Host Musician</span>
            </div>
            <div class="waiting-meta-row">
              <span class="meta-label">Session Code:</span>
              <span id="waiting-code" class="meta-code">ABC1-DEF2</span>
            </div>
          </div>

          <div class="waiting-actions">
            <button id="btn-leave-waiting" type="button" class="btn-waiting-leave secondary">Leave Session</button>
          </div>
        </div>
      </section>
